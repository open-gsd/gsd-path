name: Release trust evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/trust-validation/evidence/**"
      - "docs/trust-validation/HOST-MATRIX.md"
      - "docs/trust-validation/TRUST-EVIDENCE.md"
      - "platforms/**"
      - "scripts/skill-resources.json"
      - "scripts/check_trust_evidence.py"
  push:
    branches:
      - main
    paths:
      - "docs/trust-validation/evidence/**"
      - "docs/trust-validation/HOST-MATRIX.md"
      - "docs/trust-validation/TRUST-EVIDENCE.md"
      - "platforms/**"
      - "scripts/skill-resources.json"
      - "scripts/check_trust_evidence.py"

concurrency:
  group: release-trust-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: npm ci
      - name: Check prerequisites
        run: npm run check:prereqs
      - name: Verify release trust evidence
        run: npm run verify:release
