name: Feature request
description: A change or an addition to GSD Path.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, or what costs too much. Give a real case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Smallest change that solves it
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: The workaround you use, if there is one.
