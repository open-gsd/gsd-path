<script>
const phases=['Inspect','Define','Research','Decide','Roadmap','Plan','Build','Ship'];
const projects=[
{id:'path',name:'GSD Path',repo:'open-gsd / gsd-path',state:'active',phase:6,ms:'M004',title:'Configuration & dashboard',tasks:'6 / 9',cost:'$24.60',turns:84,time:'2 min ago',past:'Runtime isolation',future:'Release verification',note:'A shared configuration surface for the command line and dashboard.',branch:'gsd-path/M004',head:'a7c40e2',model:'gpt-6-astra',host:'Codex',reason:''},

{id:'workbench',name:'GSD Workbench',repo:'open-gsd / gsd-workbench',state:'active',phase:2,ms:'M002',title:'Project workspaces',tasks:'Not planned',cost:'$3.18',turns:16,time:'31 min ago',past:'Repository setup',future:'Session history',note:'A focused home for project work and agent sessions.',branch:'gsd-path/M002',head:'3fda410',model:'gpt-6-astra',host:'Codex',reason:''},
{id:'sorvo',name:'Sorvo',repo:'jeremymcs / sorvo-ai',state:'shipped',phase:7,ms:'M005',title:'Reporting & exports',tasks:'8 / 8',cost:'$12.08',turns:45,time:'Yesterday',past:'Team workspace',future:'No milestone planned',note:'Clear reports built from operational data.',branch:'main',head:'952eca0',model:'gpt-6-astra',host:'Codex',reason:''},
{id:'relay',name:'Relay',repo:'jeremymcs / relay',state:'shipped',phase:7,ms:'M002',title:'Webhook delivery',tasks:'5 / 5',cost:'Not available',turns:23,time:'Yesterday',past:'Event capture',future:'No milestone planned',note:'Reliable event delivery between services.',branch:'main',head:'d13ca6a',model:'Not recorded',host:'Not recorded',reason:''}
];
let page='projects',view='board',filter='all',query='',selected='path',setting='defaults',dirty=false;
const draft={shipping:'direct',review:'off',model:'inherit'};let saved={...draft};
const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const visible=()=>projects.filter(p=>(filter==='all'||p.state===filter)&&`${p.name} ${p.repo} ${p.title}`.toLowerCase().includes(query.toLowerCase()));
function projectBoard(){let rows=visible();return `<div class="heading"><div><h1>Projects</h1><p>What shipped. Where things stand. What’s ahead.</p></div><div class="push view-switch" aria-label="Project layout"><button data-view="board" aria-pressed="${view==='board'}">Board</button><button data-view="timeline" aria-pressed="${view==='timeline'}">Milestones</button></div></div><div class="filters" aria-label="Filter projects">${[['all','All'],['active','In progress'],['blocked','Blocked'],['shipped','Shipped']].map(([id,title])=>`<button data-filter="${id}" aria-pressed="${filter===id}">${title}<span class="count">${id==='all'?projects.length:projects.filter(p=>p.state===id).length}</span></button>`).join('')}<label class="search"><svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="5"/><path d="m12 12 5 5"/></svg><input id="search" aria-label="Find a project" placeholder="Find a project…" value="${esc(query)}"></label></div>${!rows.length?'<div class="empty"><h3>No matching projects</h3><p>Try another name or choose All.</p></div>':view==='board'?`<div class="board"><table><thead><tr><th>PROJECT</th><th>CURRENT MILESTONE</th><th>STATUS</th><th>TASKS</th><th>USAGE</th></tr></thead><tbody>${rows.map(p=>`<tr class="${p.state}"><td><button class="project-name" data-project="${p.id}">${p.name}<span class="chevron">›</span></button><div class="repo">${p.repo}</div></td><td><div class="milestone"><span class="mono muted">${p.ms}</span> &nbsp;${p.title}</div><div class="phase">${p.state==='shipped'?'Completed':phases[p.phase]+' · Phase '+(p.phase+1)+' of 8'}</div>${track(p)}</td><td>${state(p)}${p.reason?`<p class="issue-note">${p.reason}</p>`:''}<div class="ago">${p.time}</div></td><td class="numeric">${p.tasks}</td><td class="numeric">${p.cost}<div class="ago">${p.turns} turns</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="roadmap"><div class="road-head"><span>PROJECT</span><span>PREVIOUS</span><span>CURRENT / LATEST</span><span>PLANNED</span></div>${rows.map(p=>`<div class="road-row"><div><button class="project-name" data-project="${p.id}">${p.name} ›</button><div style="margin-top:8px">${state(p)}</div></div><div class="stop"><span class="mono">SHIPPED</span><strong>${p.past}</strong></div><div class="stop current"><span class="mono">${p.ms}</span><strong>${p.title}</strong><span class="phase">${p.state==='shipped'?'Shipped':phases[p.phase]}</span></div><div class="stop future"><span class="mono">${p.future.startsWith('No ')?'UNPLANNED':'ROADMAP'}</span><strong>${p.future}</strong></div></div>`).join('')}</div>`}<div class="board-footer"><span>${rows.length} of ${projects.length} projects · Sample snapshot</span><span>Usage reflects recorded sessions</span></div>`}
function projectDetail(){const p=projects.find(p=>p.id===selected);return `<div class="breadcrumb"><button data-page="projects">Projects</button> / ${p.name}</div><div class="project-header"><div class="flex"><span class="eyebrow">${p.repo}</span><span class="push">${state(p)}</span></div><div class="flex"><h1>${p.name}</h1><span class="push">${source('.project/STATE.md','History & files')}</span></div><p>${p.note}</p></div><div class="project-layout"><div class="project-main"><section><div class="flex"><h2 style="margin:0">${p.title}</h2><span class="mono muted push">${p.ms}</span></div><div class="phase-flow">${phases.map((v,i)=>`<div class="${i<p.phase||p.state==='shipped'?'done':i===p.phase?'now':''}"><i></i>${v}</div>`).join('')}</div><p class="muted">${p.tasks==='Not planned'?'Research is recorded. Task planning has not started.':p.tasks+' tasks complete.'} ${p.state==='shipped'?'Integrated into main.':p.state==='blocked'?'Final review is blocked.':'Current phase: '+phases[p.phase].toLowerCase()+'.'}</p>${p.reason?`<div class="context-note"><strong>Recorded review status</strong><br>${p.reason} One acceptance criterion has no matching verification receipt.</div>`:''}</section><section><h2>Milestone history</h2><ol class="milestones"><li><span class="mono">Previous</span><div><strong>${p.past}</strong><p>Archived with its verification record.</p></div><span class="status shipped">Shipped</span></li><li><span class="mono">${p.ms}</span><div><strong>${p.title}</strong><p>${p.tasks} tasks · ${p.turns} recorded turns</p></div>${state(p)}</li><li><span class="mono">Next</span><div><strong>${p.future}</strong><p>${p.future.startsWith('No ')?'No roadmap entry is recorded.':'Planned scope; work has not started.'}</p></div><span class="status planned">${p.future.startsWith('No ')?'Unplanned':'Planned'}</span></li></ol></section><section><h2>Recorded evidence</h2><table class="detail-table"><tr><th>RECORD</th><th>RESULT</th><th class="num">WHEN</th></tr><tr><td>Task verification</td><td>${p.tasks==='Not planned'?'Not recorded':'Passed'}</td><td class="num">${p.time}</td></tr><tr><td>Wave review</td><td>${p.state==='blocked'?'Verification gap':p.tasks==='Not planned'?'Not started':'Passed'}</td><td class="num">${p.time}</td></tr></table><details><summary>Activity and verification history</summary><p class="muted">Sample history: project scanned; milestone state recorded; session usage matched. Full records would remain available here.</p></details></section></div><aside class="aside"><div><h3>Workspace</h3><dl class="facts"><div><dt>Branch</dt><dd class="mono">${p.branch}</dd></div><div><dt>Commit</dt><dd class="mono">${p.head}</dd></div><div><dt>Last activity</dt><dd>${p.time}</dd></div><div><dt>Integration</dt><dd>Pull request</dd></div></dl><h3>Recorded usage</h3><dl class="facts"><div><dt>Cost</dt><dd>${p.cost}</dd></div><div><dt>Turns</dt><dd>${p.turns}</dd></div><div><dt>Host</dt><dd>${p.host}</dd></div><div><dt>Model</dt><dd>${p.model}</dd></div></dl><p>Missing prices remain “Not available”. Estimates are not invented.</p></div><details><summary>Agent breakdown and turn ledger</summary><p>${p.host} · ${p.turns} turns · ${p.cost}. Individual turns would expand here.</p></details></aside></div>`}
function settings(){return `<div class="heading"><div><h1>Settings</h1><p>Defaults for Path, with project overrides kept explicit.</p></div></div><div class="settings-layout"><nav class="settings-nav" aria-label="Settings sections">${[['defaults','Path defaults'],['models','Agent models'],['folders','Watched folders'],['plugin','Plugin']].map(([id,label])=>`<button data-setting="${id}" aria-current="${setting===id?'page':'false'}">${label}</button>`).join('')}</nav><section class="settings-body">${setting==='folders'?'<h2>Watched folders</h2><p>Projects found in these folders appear on the board.</p><div class="folder"><span class="mono">~/github/open-gsd</span><span class="muted">3 projects</span></div><div class="folder"><span class="mono">~/github/jeremymcs</span><span class="muted">2 projects</span></div><p class="notice">Folder management is represented here; this prototype does not scan your machine.</p>':setting==='plugin'?'<h2>Plugin</h2><p>Installation and runtime details in one place.</p><div class="setting-row"><div><label>Local installation</label><p>Path commands and dashboard</p></div><span class="status shipped">Installed · Sample</span></div><div class="setting-row"><div><label>Project runtimes</label><p>Each project retains its recorded runtime.</p></div><span class="muted">Inspect per project</span></div>':`<h2>${setting==='models'?'Agent models':'Path defaults'}</h2><p>Applies to future work. Existing project records keep their values.</p><form id="config-form">${setting==='models'?`<div class="setting-row"><div><label for="model">Coder model</label><p>Inherit the host default, or enter a model supported by your host.</p></div><input id="model" name="model" value="${esc(draft.model)}"></div>`:`<div class="setting-row"><div><label for="shipping">Shipping mode</label><p>Default for newly initialized projects.</p></div><select id="shipping" name="shipping"><option value="direct" ${draft.shipping==='direct'?'selected':''}>Direct integration</option><option value="pr" ${draft.shipping==='pr'?'selected':''}>Pull request</option></select></div><div class="setting-row"><div><label for="review">Review panel</label><p>Preference for future review assignments.</p></div><select id="review" name="review"><option value="off" ${draft.review==='off'?'selected':''}>Off</option><option value="detected" ${draft.review==='detected'?'selected':''}>Detected families</option></select></div>`}<div class="settings-actions"><button class="primary" id="save" ${dirty?'':'disabled'}>Save changes</button><button type="button" id="discard" ${dirty?'':'disabled'}>Discard</button><span role="status" class="demo-status" id="feedback"></span></div><p class="notice">Source: user defaults · Project overrides belong on each project’s settings surface.</p></form>`}</section></div>`}
let filePath='.project/STATE.md', fileQuery='', fileRevision=null, fileFormat='preview';
function projectFiles(p) {
  const stateText=status=>`---\nproject: ${p.name}\nmilestone: ${p.title}\nphase: ${phases[p.phase].toLowerCase()}\nstatus: ${status}\nbranch: ${p.branch}\n---\n\n# ${p.name}\n\n## Current milestone\n${p.title}\n\n${p.note}\n\n## Recorded state\n${status==='blocked'?p.reason:'Work is recorded in the current milestone.'}\n\n## Log\n- Project state recorded.\n- Task verification collected.\n\nThis is a sample document for the design study, not a live project file.`;
  return [
    {path:'.project/STATE.md',group:'Current milestone',versions:[{at:'09:12',label:'Build checkpoint',text:stateText('active')},{at:'09:38',label:'Latest recorded state',text:stateText(p.state)}]},
    {path:'.project/ROADMAP.md',group:'Current milestone',text:`# Roadmap\n\n## Previous\n${p.past}\n\n## ${p.ms}: ${p.title}\n${p.note}\n\n## Planned\n${p.future}\n\nPlanned work has not started. Dates are not forecast.`},
    {path:'.project/intent/INTENT.md',group:'Current milestone',text:`# Intent\n\n## Summary\n${p.note}\n\n## Success criteria\n- SC1: The primary workflow is available.\n- SC2: Verification evidence matches the approved scope.\n\n## Constraints\nPreserve project records and show missing evidence explicitly.`},
    {path:'.project/plan/PLAN.md',group:'Current milestone',text:`# Plan\n\n## Wave 1: Foundations\n- T001: Model the workflow.\n- T002: Build the primary view.\n\n## Wave 2: Verification\n- T003: Verify the complete flow.\n\n## Verification\n\`python3 -m unittest tests.test_workflow\`\n\nSample plan. This viewer never executes commands.`},
    {path:'.project/tasks/T003-verify-flow.md',group:'Current milestone',text:`# T003: Verify the complete flow\n\n## Acceptance criteria\n- The primary workflow completes.\n- Errors remain visible.\n\n## Files\n- tests/test_workflow.py\n\n## Log\nVerification output collected. Review checks the recorded evidence.`},
    {path:'.project/review/FINAL.md',group:'Current milestone',text:`# Final review\n\n## Verdict\n${p.state==='blocked'?'Blocked: verification evidence is incomplete.':'Sample review record.'}\n\n| Criterion | Result |\n| --- | --- |\n| SC1 | Met |\n| SC2 | ${p.state==='blocked'?'Unverifiable':'Met'} |\n\n## Findings\n${p.reason||'No blocking finding is recorded in this sample.'}\n\n## Evidence\nSee the verification ledger for the recorded command result.`},
    {path:'.project/build/verify-ledger.jsonl',group:'Current milestone',text:'{"task":"T001","result":"pass","command":"python3 -m unittest tests.test_workflow","recorded_at":"09:12"}\n{"task":"T003","result":"pass","command":"python3 -m unittest tests.test_workflow","recorded_at":"09:31"}'},
    {path:'.project/discuss/ANSWERS.md',group:'Current milestone',text:'# Discussion answers\n\nNo discussion answers are recorded in this sample.\n\nAbsence of a record is not an approval.'},
    {path:'.project/LESSONS.md',group:'Current milestone',text:'# Lessons\n\n## Latest milestone\nKeep verification receipts linked to the task and revision that produced them.'},
    {path:'.project/archive/previous/MANIFEST.md',group:'Archived milestone',text:`# Archive manifest\n\n## Milestone\n${p.past}\n\n## Outcome\nShipped and archived.\n\n## Record\n- Integration: pull request\n- Review: passed\n- Verification: passed\n\nArchive contents are read-only.`},
    {path:'README.md',group:'Repository',text:`# ${p.name}\n\n${p.note}\n\n## Development\nConsult the project plan for the current scope.\n\n\`\`\`sh\npython3 -m unittest tests.test_workflow\n\`\`\`\n\nThis sample preserves text such as \x3cscript>alert('example')\x3c/script> as text, never executable HTML.`}
  ].map(f=>({...f,versions:f.versions||[{at:'09:38',label:'Current sample',text:f.text}]}));
}
function markdownPreview(text) {
  const inline=line=>esc(line).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  let html='',code=false,table=false,list=false;
  for(const line of text.split('\n')) {
    if(line.startsWith('```')) {if(table){html+='</tbody></table>';table=false}if(list){html+='</ul>';list=false}html+=code?'</code></pre>':'<pre><code>';code=!code;continue}
    if(code){html+=esc(line)+'\n';continue}
    if(line.startsWith('|')){if(!table){html+='<table><tbody>';table=true}if(/^\|[\s:|\-]+\|$/.test(line))continue;html+='<tr>'+line.split('|').slice(1,-1).map(c=>'<td>'+inline(c.trim())+'</td>').join('')+'</tr>';continue}
    if(table){html+='</tbody></table>';table=false}
    if(line.startsWith('- ')){if(!list){html+='<ul>';list=true}html+='<li>'+inline(line.slice(2))+'</li>';continue}
    if(list){html+='</ul>';list=false}
    const h=line.match(/^(#{1,6}) (.*)$/);
    if(h)html+=`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`;
    else if(line==='---')html+='<hr>';
    else if(line.trim())html+='<p>'+inline(line)+'</p>';
  }
  return html+(code?'</code></pre>':'')+(table?'</tbody></table>':'')+(list?'</ul>':'');
}
function openFile(path) {filePath=path;fileRevision=null;fileQuery='';fileFormat=path.endsWith('.md')?'preview':'raw';page='files';render();scrollTo(0,0)}
function source(path,label='View source') {return `<button class="source-link" data-open-file="${esc(path)}">${esc(label)} ↗</button>`}
function fileViewer() {
  const p=projects.find(p=>p.id===selected),files=projectFiles(p),f=files.find(f=>f.path===filePath)||files[0];
  const revision=fileRevision===null?f.versions.length-1:fileRevision,record=f.versions[revision]||f.versions.at(-1);
  const filtered=files.filter(f=>f.path.toLowerCase().includes(fileQuery.toLowerCase()));
  return `<div class="breadcrumb"><button data-page="projects">Projects</button> / <button data-page="detail">${p.name}</button> / History & files</div>
  <div class="heading"><div><h1>History & files</h1><p>Project records, preserved with their context.</p></div><span class="push muted">Read-only · Sample documents</span></div>
  <div class="file-workspace"><aside class="file-sidebar"><label class="eyebrow" for="file-search">Find a file</label><input id="file-search" placeholder="Name or path…" value="${esc(fileQuery)}"><nav class="file-list" aria-label="Project files">${filtered.length?['Current milestone','Archived milestone','Repository'].map(group=>{const rows=filtered.filter(f=>f.group===group);return rows.length?`<h3 class="eyebrow">${group}</h3>${rows.map(item=>`<button data-file="${esc(item.path)}" aria-current="${item.path===f.path?'page':'false'}"><span>${esc(item.path.split('/').at(-1))}</span><small>${esc(item.path.split('/').slice(0,-1).join('/')||'Project root')}</small></button>`).join('')}`:''}).join(''):'<p class="notice">No matching files. Try another path.</p>'}</nav></aside>
  <section class="file-content"><div class="file-toolbar"><div><div class="file-path mono">${esc(f.path)}</div><div class="muted file-meta">${esc(p.name)} · ${f.group} · ${record.at} · ${new TextEncoder().encode(record.text).length} bytes</div></div><div class="view-switch push"><button data-format="preview" aria-pressed="${fileFormat==='preview'}" ${f.path.endsWith('.md')?'':'disabled'}>Preview</button><button data-format="raw" aria-pressed="${fileFormat==='raw'}">Raw</button></div></div>
  <div class="revision-bar"><label for="revision">Recorded version</label><select id="revision">${f.versions.map((v,i)=>`<option value="${i}" ${i===revision?'selected':''}>${v.at} · ${v.label}${i===f.versions.length-1?' (latest)':''}</option>`).join('')}</select><span class="muted">${f.group==='Archived milestone'?'Archived record':revision===f.versions.length-1?'Latest sample':'Earlier snapshot'}</span></div>
  <article class="document" aria-label="File contents">${fileFormat==='preview'&&f.path.endsWith('.md')?markdownPreview(record.text):`<pre>${esc(record.text)}</pre>`}</article>
  <details class="file-history" open><summary>History for this file · ${f.versions.length} recorded ${f.versions.length===1?'version':'versions'}</summary>${[...f.versions].reverse().map((v,i)=>`<button data-revision="${f.versions.length-1-i}"><span class="mono">${v.at}</span><span>${esc(v.label)}</span><span class="muted">View snapshot →</span></button>`).join('')}<p class="notice">This study demonstrates stored snapshots. Filesystem polling alone cannot reconstruct old file contents. Git or explicit snapshot storage is needed in the live version.</p></details></section></div>`;
}
function additionalDetails(p) {
  return `<section class="additional-details"><div class="flex"><h2>Project records</h2>${source('.project/STATE.md','History & files')}</div><p class="muted">Sample coverage below. Missing records stay explicit.</p>
  <details open><summary>Tasks, waves & acceptance criteria</summary><div class="record-table"><table class="detail-table"><tr><th>TASK</th><th>WAVE</th><th>STATE</th><th>SOURCE</th></tr><tr><td>T001 · Model the workflow</td><td>1 · Foundations</td><td>Done</td><td>${source('.project/plan/PLAN.md','Plan')}</td></tr><tr><td>T003 · Verify the complete flow</td><td>2 · Verification</td><td>${p.state==='blocked'?'Review blocked':'Recorded'}</td><td>${source('.project/tasks/T003-verify-flow.md','Task file')}</td></tr></table></div><p class="notice">SC1: Met · SC2: ${p.state==='blocked'?'Unverifiable':'Met'} ${source('.project/review/FINAL.md','Review criteria')}</p></details>
  <details><summary>Reviews & verification history</summary><div class="record-table"><table class="detail-table"><tr><th>RECORD</th><th>VERDICT</th><th>SOURCE</th></tr><tr><td>Final review</td><td>${p.state==='blocked'?'Blocked':'Passed'}</td><td>${source('.project/review/FINAL.md','Review')}</td></tr><tr><td>Task verification</td><td>Recorded output</td><td>${source('.project/build/verify-ledger.jsonl','Full ledger')}</td></tr></table></div></details>
  <details><summary>Usage, models, agents & turns</summary><p class="notice">Illustrative breakdown, not live accounting. Per-phase/task attribution is unavailable in this sample.</p><div class="record-table"><table class="detail-table"><tr><th>INPUT TOKENS</th><th>CACHED</th><th>OUTPUT</th><th>CACHE HIT</th><th>AGENT TIME</th></tr><tr><td>180,000</td><td>120,000</td><td>9,200</td><td>40%</td><td>12m 30s</td></tr></table><table class="detail-table"><tr><th>AGENT / MODEL</th><th>HOST</th><th>TURNS</th><th>COST</th></tr><tr><td>Coder · ${p.model}</td><td>${p.host}</td><td>${p.turns}</td><td>${p.cost}</td></tr></table></div><details><summary>Turn ledger</summary><div class="record-table"><table class="detail-table"><tr><th>TIME</th><th>AGENT</th><th>IN / CACHED / OUT</th><th>DURATION</th><th>COST</th></tr><tr><td>09:31</td><td>Coder</td><td>4,200 / 2,800 / 360</td><td>14s</td><td>Not priced</td></tr></table></div></details></details>
  <details><summary>Discussion, lessons & activity</summary><p>No discussion answers are recorded in this sample. ${source('.project/discuss/ANSWERS.md','Answers')}</p><p class="notice">Latest lesson: keep verification receipts linked to their task and revision. ${source('.project/LESSONS.md','Lessons')}</p><ol class="record-events"><li><span class="mono">09:12</span> Build checkpoint ${source('.project/STATE.md','State history')}</li><li><span class="mono">09:31</span> Verification collected ${source('.project/build/verify-ledger.jsonl','Ledger')}</li><li><span class="mono">09:38</span> Review recorded ${source('.project/review/FINAL.md','Review')}</li></ol></details>
  <details><summary>Data coverage & sources</summary><table class="detail-table"><tr><th>SOURCE</th><th>COVERAGE</th></tr><tr><td>Project documents</td><td>Sample files, browseable in full</td></tr><tr><td>Archived milestones</td><td>Manifest example only</td></tr><tr><td>Session usage</td><td>Illustrative values</td></tr><tr><td>Git file history</td><td>Not connected</td></tr><tr><td>Other host logs</td><td>Not connected</td></tr></table><p class="notice">Live design: show read time and distinguish loaded, missing, unsupported, and failed sources. Do not turn a missing record into zero.</p></details></section>`;
}

function render(){app.innerHTML=page==='projects'?projectBoard():page==='detail'?projectDetail()+additionalDetails(projects.find(p=>p.id===selected)):page==='files'?fileViewer():settings();document.querySelectorAll('.topnav button').forEach(b=>b.setAttribute('aria-current',b.dataset.page===(['detail','files'].includes(page)?'projects':page)?'page':'false'));document.querySelector('#concept').textContent=view==='board'?'A · Project board':'B · Milestone timeline'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.openFile){openFile(b.dataset.openFile);return}if(b.dataset.file){filePath=b.dataset.file;fileRevision=null;fileFormat=filePath.endsWith('.md')?'preview':'raw';render();return}if(b.dataset.format){fileFormat=b.dataset.format;render();return}if(b.dataset.revision!==undefined){fileRevision=Number(b.dataset.revision);render();return}if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.project){selected=b.dataset.project;page='detail';render();scrollTo(0,0)}if(b.dataset.view){view=b.dataset.view;render()}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.setting){setting=b.dataset.setting;render()}if(b.id==='theme'){const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';b.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}if(b.id==='discard'){Object.assign(draft,saved);dirty=false;render()}});
document.addEventListener('change',e=>{if(e.target.id==='revision'){fileRevision=Number(e.target.value);render()}});
document.addEventListener('input',e=>{if(e.target.id==='file-search'){fileQuery=e.target.value;const pos=e.target.selectionStart;render();const input=document.querySelector('#file-search');input.focus();input.setSelectionRange(pos,pos);return}if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const s=document.querySelector('#search');s.focus();s.setSelectionRange(pos,pos)}if(['shipping','review','model'].includes(e.target.name)){draft[e.target.name]=e.target.value;dirty=Object.keys(draft).some(k=>draft[k]!==saved[k]);document.querySelector('#save').disabled=!dirty;document.querySelector('#discard').disabled=!dirty;document.querySelector('#feedback').textContent=''}});
document.addEventListener('submit',e=>{if(e.target.id!=='config-form')return;e.preventDefault();saved={...draft};dirty=false;render();document.querySelector('#feedback').textContent='Saved in this prototype'});render();
</script>
