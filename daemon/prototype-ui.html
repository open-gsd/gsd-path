<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Question: "what should the gsd-path daemon interface look like?"
  Four variants of the daemon UI, switchable via ?variant= or the bottom bar (←/→ keys).
  Run: open daemon/prototype-ui.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gsd-path daemon — UI prototype</title>
<style>
  :root {
    --bg: #1e1f24; --panel: #26272e; --panel2: #2e3038; --line: #3a3c46;
    --text: #e8e9ee; --dim: #9a9ca8; --faint: #6a6c78;
    --green: #34c759; --yellow: #ffd60a; --red: #ff453a; --blue: #0a84ff; --purple: #bf5af2;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.45 -apple-system, "SF Pro Text", "Segoe UI", sans-serif; min-height: 100vh; }
  .banner { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: #3d2e00; color: var(--yellow);
            text-align: center; font-size: 11px; padding: 4px; letter-spacing: .4px; }
  .stage { padding: 44px 24px 120px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.active  { background: #0f3d22; color: var(--green); }
  .pill.blocked { background: #451614; color: var(--red); }
  .pill.done    { background: #0d2f52; color: var(--blue); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .dot.g { background: var(--green); } .dot.y { background: var(--yellow); } .dot.r { background: var(--red); }
  .bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 3px; }
  .dim { color: var(--dim); } .faint { color: var(--faint); }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }

  /* fake macOS desktop + menu bar (variants A & B) */
  .desktop { max-width: 980px; margin: 0 auto; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
             background: linear-gradient(160deg, #2b3a55, #1a2030 60%, #241f2e); min-height: 560px; position: relative; }
  .menubar { display: flex; align-items: center; gap: 18px; height: 26px; padding: 0 12px;
             background: rgba(30,30,34,.82); backdrop-filter: blur(14px); font-size: 12px; }
  .menubar .sp { flex: 1; }
  .trayicon { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,.12); border-radius: 5px; padding: 1px 7px; cursor: default; }
  .trayicon svg { display: block; }

  /* Variant A — native dropdown menu */
  .menu { position: absolute; top: 28px; right: 90px; width: 340px; background: rgba(38,38,44,.96); backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,.09); border-radius: 9px; box-shadow: 0 14px 44px rgba(0,0,0,.55); padding: 5px; }
  .mi { display: flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 5px; white-space: nowrap; }
  .mi:hover { background: var(--blue); color: #fff; }
  .mi.header { font-weight: 700; }
  .mi.sub { padding-left: 26px; color: var(--dim); }
  .mi.sub:hover { color: #fff; }
  .mi .r { margin-left: auto; color: var(--faint); font-size: 11px; }
  .mi:hover .r { color: #cfe1ff; }
  .sep { height: 1px; background: var(--line); margin: 5px 10px; }

  /* Variant B — popover card panel */
  .popover { position: absolute; top: 30px; right: 40px; width: 400px; background: rgba(34,35,41,.97); backdrop-filter: blur(24px);
             border: 1px solid rgba(255,255,255,.09); border-radius: 14px; box-shadow: 0 18px 60px rgba(0,0,0,.6); padding: 14px;
             max-height: 540px; overflow: auto; }
  .pcard { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 10px; }
  .pcard .top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .pcard .name { font-weight: 700; font-size: 14px; }
  .pcard .ms { color: var(--dim); font-size: 11px; }
  .steps { display: flex; align-items: center; gap: 3px; margin: 9px 0 7px; }
  .step { flex: 1; height: 4px; border-radius: 2px; background: var(--line); position: relative; }
  .step.done { background: var(--green); }
  .step.now { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
  .steplabel { font-size: 10px; color: var(--faint); display: flex; justify-content: space-between; margin-bottom: 8px; }
  .prow { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); margin-top: 3px; }
  .prow b { color: var(--text); font-weight: 600; }

  /* Variant C — full dashboard */
  .dash { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 240px 1fr; gap: 0;
          border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 640px; background: var(--panel); }
  .side { border-right: 1px solid var(--line); padding: 14px 10px; background: #23242a; }
  .side h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--faint); padding: 6px 10px; }
  .sitem { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; cursor: default; }
  .sitem.sel { background: var(--panel2); }
  .sitem .nm { font-weight: 600; }
  .sitem .sub { font-size: 11px; color: var(--faint); }
  .main { padding: 18px 22px; }
  .main h2 { font-size: 19px; margin-bottom: 2px; }
  .statrow { display: flex; gap: 12px; margin: 14px 0 18px; }
  .stat { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .stat .v { font-size: 20px; font-weight: 700; }
  .stat .k { font-size: 11px; color: var(--faint); }
  table.tasks { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.tasks th { text-align: left; color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
                   padding: 6px 10px; border-bottom: 1px solid var(--line); }
  table.tasks td { padding: 7px 10px; border-bottom: 1px solid #2b2c33; }
  .wavehead td { padding-top: 16px; font-weight: 700; color: var(--dim); border-bottom: none; }

  /* Variant C tabs + detail widgets */
  .sitem { cursor: pointer; } .sitem:hover { background: #2a2b32; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; }
  .tab { padding: 7px 14px; font-size: 12.5px; color: var(--dim); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab:hover { color: var(--text); }
  .tab.sel { color: var(--text); border-bottom-color: var(--blue); font-weight: 600; }
  .tab .n { background: var(--panel2); border-radius: 8px; padding: 0 6px; font-size: 10.5px; margin-left: 4px; }
  .tab.sel .n { background: var(--blue); color: #fff; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .box { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .box h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--faint); margin-bottom: 8px; }
  .crit { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid #2b2c33; font-size: 12.5px; }
  .crit:first-of-type { border-top: none; }
  .vmet { color: var(--green); font-weight: 700; width: 86px; flex: none; }
  .vnot { color: var(--red); font-weight: 700; width: 86px; flex: none; }
  .vunv { color: var(--yellow); font-weight: 700; width: 86px; flex: none; }
  .ans { background: #23242a; border: 1px solid var(--line); border-left: 3px solid var(--yellow); border-radius: 8px;
         padding: 9px 12px; margin-bottom: 8px; font-size: 12.5px; }
  .ans .meta { color: var(--faint); font-size: 11px; margin-top: 4px; }
  .ans.resolved { border-left-color: var(--green); opacity: .65; }
  .rev { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #2b2c33; font-size: 12.5px; }
  .rev:first-of-type { border-top: none; }
  .ledger { font: 11.5px/1.7 ui-monospace, monospace; color: var(--dim); }
  .ledger .pass { color: var(--green); } .ledger .fail { color: var(--red); }
  .rms { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid #2b2c33; font-size: 13px; }
  .rms:first-of-type { border-top: none; }
  .rms .mnum { font-weight: 700; width: 48px; }
  .rms .arch { margin-left: auto; font: 10.5px ui-monospace, monospace; color: var(--faint); }

  /* Variant D — timeline swimlanes */
  .tl { max-width: 1100px; margin: 0 auto; }
  .lanegrid { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 18px; margin-bottom: 16px; }
  .axis { display: grid; grid-template-columns: 130px repeat(8, 1fr); font-size: 10.5px; color: var(--faint); margin-bottom: 10px; }
  .axis span { text-align: center; }
  .lane { display: grid; grid-template-columns: 130px repeat(8, 1fr); align-items: center; height: 46px; border-top: 1px solid #2b2c33; }
  .lane .who { font-weight: 600; font-size: 12.5px; }
  .lane .who .sub { display: block; font-weight: 400; font-size: 10.5px; color: var(--faint); }
  .seg { height: 14px; border-radius: 7px; margin: 0 2px; background: var(--line); position: relative; }
  .seg.done { background: #1f5c35; }
  .seg.now  { background: var(--blue); box-shadow: 0 0 8px rgba(10,132,255,.6); }
  .seg.blocked { background: var(--red); }
  .feed { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 14px 18px; }
  .feed h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .7px; color: var(--faint); margin-bottom: 8px; }
  .fe { display: flex; gap: 10px; padding: 6px 0; border-top: 1px solid #2b2c33; font-size: 12.5px; }
  .fe time { color: var(--faint); width: 52px; flex: none; }

  /* data drawer */
  .drawer-toggle { position: fixed; bottom: 86px; right: 16px; z-index: 60; background: var(--panel2); border: 1px solid var(--line);
                   color: var(--dim); border-radius: 7px; padding: 5px 10px; cursor: pointer; font-size: 11.5px; }
  .drawer { position: fixed; bottom: 122px; right: 16px; z-index: 60; width: 420px; max-height: 50vh; overflow: auto; display: none;
            background: #141519; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .drawer.open { display: block; }
  .drawer pre { font: 10.5px/1.5 ui-monospace, monospace; color: #9fd0a8; white-space: pre-wrap; }

  /* switcher */
  .switcher { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 70;
              display: flex; align-items: center; gap: 4px; background: #f5f5f7; color: #111;
              border-radius: 999px; padding: 6px 8px; box-shadow: 0 10px 34px rgba(0,0,0,.6); font-weight: 600; }
  .switcher button { border: none; background: #e2e2e8; color: #111; width: 34px; height: 34px; border-radius: 50%;
                     font-size: 16px; cursor: pointer; }
  .switcher button:hover { background: #d0d0da; }
  .switcher .label { min-width: 300px; text-align: center; font-size: 13px; }
  .switcher .label small { display: block; font-weight: 400; color: #555; font-size: 10.5px; }
</style>
</head>
<body>
<div class="banner">PROTOTYPE — THROWAWAY · mock data, no wiring · question: what should the daemon interface look like?</div>
<div class="stage" id="stage"></div>

<button class="drawer-toggle" onclick="document.querySelector('.drawer').classList.toggle('open')">{ } mock state</button>
<div class="drawer"><pre id="mockjson"></pre></div>

<div class="switcher">
  <button onclick="cycle(-1)">‹</button>
  <div class="label" id="vlabel"></div>
  <button onclick="cycle(1)">›</button>
</div>

<script>
/* ---------- mock state: shape mirrors gsd_daemon.model.ProjectStatus.to_dict() ---------- */
const MOCK = {
  schema: "gsd-path-daemon/status/v1",
  generated_at: "2026-09-11T14:32:07Z",
  projects: [
    { root: "~/orca/workspaces/orca", project: "orca", milestone: "fleet-ui",
      phase: "build", status: "active", branch: "gsd-path/M002", git: {dirty: false},
      tasks_done: 7, tasks_total: 12, current_wave: 2,
      waves: {1: "graph model", 2: "fleet intents", 3: "resolve"},
      pending_answers: [{answer: "A014", owner: "gsd-path-plan", status: "NEEDS-USER"}],
      next_skill: "gsd-path-build", status_source: "runtime", last_activity_iso: "2026-09-11T14:29:51Z" },
    { root: "~/orca/workspaces/gsd-path/daemon", project: "gsd-path", milestone: "daemon",
      phase: "ship", status: "blocked", branch: "gsd-path/M001", git: {dirty: true},
      tasks_done: 12, tasks_total: 12, current_wave: null,
      waves: {1: "core parsers", 2: "watcher", 3: "tray"},
      pending_answers: [
        {answer: "A002", owner: "gsd-path-define", status: "final"},
        {answer: "A007", owner: "gsd-path-plan",  status: "NEEDS-USER"}],
      next_skill: "gsd-path-forensics", status_source: "runtime", last_activity_iso: "2026-09-11T13:58:12Z",
      note: "final review: 1 criterion not-met (SC4)" },
    { root: "~/work/memtrace", project: "memtrace", milestone: "cortex-sync",
      phase: "research", status: "active", branch: "gsd-path/M003", git: {dirty: false},
      tasks_done: 0, tasks_total: 0, current_wave: null, waves: {},
      pending_answers: [], next_skill: "gsd-path-decide", status_source: "parse-only",
      last_activity_iso: "2026-09-10T22:14:40Z",
      next_milestone: {phase: "define", status: "active", milestone: "edge-cache"} },
    { root: "~/work/loopy", project: "loopy", milestone: "publish-flow",
      phase: "shipped", status: "done", branch: null, git: {dirty: false},
      tasks_done: 9, tasks_total: 9, current_wave: null, waves: {1: "spec", 2: "runner"},
      pending_answers: [], next_skill: null, status_source: "parse-only",
      last_activity_iso: "2026-09-08T17:02:33Z" }
  ],
  history: [
    {t: "14:29", ev: "tasks-changed",    p: "orca",     d: "6/12 → 7/12 (T207 done)"},
    {t: "14:11", ev: "pending-answers",  p: "gsd-path", d: "A007 NEEDS-USER (plan)"},
    {t: "13:58", ev: "blocked",          p: "gsd-path", d: "ship blocked — SC4 not-met"},
    {t: "13:02", ev: "phase-changed",    p: "gsd-path", d: "build → ship"},
    {t: "11:47", ev: "project-added",    p: "memtrace", d: "discovered under ~/work"},
    {t: "09:15", ev: "phase-changed",    p: "memtrace", d: "define → research"}
  ]
};
document.getElementById("mockjson").textContent = JSON.stringify(MOCK, null, 1);

const PHASES = ["inspect","define","research","decide","roadmap","plan","build","ship"];
const pct = p => p.tasks_total ? Math.round(100*p.tasks_done/p.tasks_total) : 0;
const health = p => p.status === "blocked" ? "r" : (p.pending_answers.length || (p.git&&p.git.dirty)) ? "y" : "g";
const badge = p => p.status === "blocked" ? '<span class="pill blocked">blocked</span>'
                 : p.phase === "shipped"      ? '<span class="pill done">shipped</span>'
                 : '<span class="pill active">' + p.phase + '</span>';
const ms = p => p.milestone ? "M· " + p.milestone : "—";
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
/* display form of a skill id: "gsd-path-forensics" -> "FORENSICS". Raw id kept for copy actions. */
const skill = s => s ? s.replace(/^gsd-path-/, "").toUpperCase() : null;
const fmt = n => n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);
const icon = () => `<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="none" stroke="#ffd60a" stroke-width="2"/><circle cx="7" cy="7" r="2.4" fill="#ffd60a"/></svg>`;
const active = MOCK.projects.filter(p => p.status !== "done" || p.phase !== "shipped");

/* ============================ VARIANT A — native menu list ============================ */
function VariantA() {
  let rows = "";
  for (const p of MOCK.projects) {
    rows += `<div class="mi header"><span class="dot ${health(p)}"></span> ${esc(p.project)} <span class="r">${esc(ms(p))}</span></div>`;
    if (p.phase === "shipped") {
      rows += `<div class="mi sub">Shipped · ${p.tasks_done}/${p.tasks_total} tasks <span class="r">8 Sep</span></div>`;
    } else {
      rows += `<div class="mi sub">Phase: ${p.phase} (${p.status}) ${p.status==="blocked"?'· <b style="color:#ff9f0a">SC4 not-met</b>':''}</div>`;
      if (p.tasks_total) rows += `<div class="mi sub">Tasks: ${p.tasks_done}/${p.tasks_total} done${p.current_wave ? " — Wave " + p.current_wave + " ("+esc(p.waves[p.current_wave])+")" : ""}</div>`;
      if (p.branch) rows += `<div class="mi sub">Branch: ${esc(p.branch)} (${p.git.dirty ? "dirty" : "clean"})</div>`;
      if (p.pending_answers.length) rows += `<div class="mi sub">⚠ Pending answers: ${p.pending_answers.length} <span class="r">${p.pending_answers.map(a=>a.answer).join(", ")}</span></div>`;
      if (p.next_milestone) rows += `<div class="mi sub">⏭ Next: ${esc(p.next_milestone.milestone)} (${p.next_milestone.phase})</div>`;
      if (p.next_skill) rows += `<div class="mi sub">Next: <kbd>${skill(p.next_skill)}</kbd> <span class="r">⌘C copies $${p.next_skill}</span></div>`;
      const ua = DETAILS[p.project] && DETAILS[p.project].usage;
      if (ua) rows += `<div class="mi sub">⚡ ${fmt(ua.tokens_in+ua.tokens_out)} tok · $${ua.cost.toFixed(2)} · ${esc(ua.models[0][0])} ${Math.round(ua.models[0][2]*100)}%</div>`;
      rows += `<div class="mi sub">Reveal in Finder</div><div class="mi sub">Copy status JSON</div>`;
    }
    rows += `<div class="sep"></div>`;
  }
  return `
  <div class="desktop">
    <div class="menubar"><b></b> File &nbsp;Edit &nbsp;View <span class="sp"></span>
      <span class="trayicon">${icon()} 2 active · 1 blocked</span> <span class="dim">Fri 14:32</span></div>
    <div class="menu">
      ${rows}
      <div class="mi">Add watched folder…</div>
      <div class="mi">Watched folders <span class="r">~/orca/workspaces, ~/work ▸</span></div>
      <div class="mi">Rescan now</div>
      <div class="mi">Pause monitoring <span class="r">☐</span></div>
      <div class="sep"></div>
      <div class="mi">Open dashboard <span class="r">localhost:8765</span></div>
      <div class="mi">Quit gsd-path daemon</div>
    </div>
  </div>
  <p class="faint" style="max-width:980px;margin:10px auto 0">Faithful OS-native dropdown (what pystray can actually render): plain text items, submenus, no widgets. Cheapest to build, zero custom UI, works identically on macOS + Windows — but dense projects get long, and progress is words, not pictures.</p>`;
}

/* ===================== VARIANT B — menu-bar popover (card panel) ===================== */
function VariantB() {
  let cards = "";
  for (const p of MOCK.projects) {
    const idx = PHASES.indexOf(p.phase);
    let steps = "";
    for (let i = 0; i < PHASES.length; i++) {
      const cls = p.phase === "shipped" ? "done" : i < idx ? "done" : i === idx ? (p.status==="blocked" ? "now\" style=\"background:var(--red);box-shadow:0 0 6px var(--red)" : "now") : "";
      steps += `<div class="step ${cls}"></div>`;
    }
    cards += `
    <div class="pcard">
      <div class="top"><span class="dot ${health(p)}"></span><span class="name">${esc(p.project)}</span>
        <span class="ms">${esc(ms(p))}</span><span style="margin-left:auto">${badge(p)}</span></div>
      <div class="steps">${steps}</div>
      <div class="steplabel"><span>inspect</span><span>decide</span><span>build</span><span>ship</span></div>
      ${p.tasks_total ? `<div class="bar"><i style="width:${pct(p)}%"></i></div>
      <div class="prow"><span>Tasks <b>${p.tasks_done}/${p.tasks_total}</b>${p.current_wave?` · wave ${p.current_wave} “${esc(p.waves[p.current_wave])}”`:" · all done"}</span><span>${pct(p)}%</span></div>` : `<div class="prow"><span>No tasks yet — pre-plan phase</span></div>`}
      <div class="prow"><span>${p.branch ? esc(p.branch) + (p.git.dirty ? " · <b style='color:var(--yellow)'>dirty</b>" : " · clean") : "no branch"}</span>
        ${p.next_skill ? `<span><kbd>${skill(p.next_skill)}</kbd></span>` : ""}</div>
      ${p.pending_answers.length ? `<div class="prow"><span style="color:var(--yellow)">⚠ ${p.pending_answers.length} pending answer${p.pending_answers.length>1?"s":""} — ${p.pending_answers.map(a=>a.answer+" ("+a.status+")").join(", ")}</span></div>` : ""}
      ${p.note ? `<div class="prow"><span style="color:var(--red)">⛔ ${esc(p.note)}</span></div>` : ""}
      ${p.next_milestone ? `<div class="prow"><span>⏭ lookahead: ${esc(p.next_milestone.milestone)} (${p.next_milestone.phase})</span></div>` : ""}
      ${(() => { const du = DETAILS[p.project]; if (!du || !du.usage) return ""; const u = du.usage;
        return `<div class="prow"><span>⚡ ${fmt(u.tokens_in+u.tokens_out)} tok · $${u.cost.toFixed(2)}</span>
        <span>${p.phase !== "shipped" ? `⏱ ${du.time_in_phase} in ${p.phase}` : "milestone complete"}</span></div>`; })()}
    </div>`;
  }
  return `
  <div class="desktop">
    <div class="menubar"><b></b> File &nbsp;Edit &nbsp;View <span class="sp"></span>
      <span class="trayicon">${icon()} 16/33 tasks</span> <span class="dim">Fri 14:32</span></div>
    <div class="popover">
      <div style="display:flex;align-items:baseline;margin-bottom:10px">
        <b style="font-size:15px">gsd-path</b>
        <span class="dim" style="margin-left:8px;font-size:11px">${MOCK.projects.length} projects · updated 14:32:07</span>

  ["B", "Menu-bar popover cards", VariantB],
  ["C", "Localhost dashboard", VariantC],
  ["D", "Fleet timeline + feed", VariantD],
];
function current() {
  const v = new URLSearchParams(location.search).get("variant") || "A";
  return VARIANTS.some(x => x[0] === v) ? v : "A";
}
function render() {
  const i = VARIANTS.findIndex(x => x[0] === current());
  document.getElementById("stage").innerHTML = VARIANTS[i][2]();
  document.getElementById("vlabel").innerHTML =
    `${VARIANTS[i][0]} — ${VARIANTS[i][1]}<small>?variant=${VARIANTS[i][0]} · ←/→ to switch · ${VARIANTS.length} variants</small>`;
}
function cycle(d) {
  const i = VARIANTS.findIndex(x => x[0] === current());
  const n = VARIANTS[(i + d + VARIANTS.length) % VARIANTS.length][0];
  const u = new URL(location.href); u.searchParams.set("variant", n);
  history.replaceState(null, "", u); render();
}
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
